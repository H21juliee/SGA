<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Conexión — SGA</title>
    <meta name="theme-color" content="#26465c">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f6f9 0%, #dcebf2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1f3242;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 28px;
            box-shadow: 0 20px 40px -15px rgba(38, 70, 92, 0.15);
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #26465c, #336b87, #f59e0b);
        }
        .icon-container {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(51, 107, 135, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .icon-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .offline-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #fee2e2;
            color: #dc2626;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .offline-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #dc2626;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #1f3242;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 14px;
            color: #5d9bb4;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #336b87;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 16px -4px rgba(51, 107, 135, 0.4);
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-retry:hover {
            background: #26465c;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -4px rgba(51, 107, 135, 0.5);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .footnote {
            font-size: 11px;
            color: #90bcce;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="accent-bar"></div>
        <div class="icon-container">
            <img src="/pwa-192x192.png" alt="SGA" onerror="this.style.display='none'">
        </div>
        <div class="offline-badge">
            <span class="offline-dot"></span>
            Modo Sin Conexión
        </div>
        <h1>Sin conexión a Internet</h1>
        <p>No se pudo conectar con el servidor del SGA. El sistema recargará automáticamente la página en cuanto se restablezca tu conexión.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Reintentar Conexión
        </button>
        <div class="footnote">Sistema de Gestión Académica (SGA)</div>
    </div>

    <script>
        // Auto-reload when connection returns
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
